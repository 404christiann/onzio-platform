<!doctype html>
<html lang="en">
  <body style="margin:0;background:#0e0e0e;color:#ffffff;font-family:Arial,sans-serif;padding:32px">
    <main style="max-width:520px;margin:0 auto;background:#1a1a1a;border:1px solid #333333;border-radius:16px;padding:32px">
      <p style="margin:0;color:#ef4444;font-size:13px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase">Onzio</p>
      <h1 style="margin:10px 0 12px;font-size:26px;line-height:1.2">Your sign-in code</h1>
      <p style="margin:0 0 22px;color:#b3b3b3;line-height:1.6">Enter this six-digit code in the Onzio admin portal:</p>
      <p style="margin:0 0 22px;font-family:monospace;font-size:34px;font-weight:700;letter-spacing:0.2em;color:#ffffff">{{ .Token }}</p>
      <p style="margin:0;color:#8f8f8f;font-size:13px;line-height:1.6">If you did not request this code, you can ignore this email. Never share the code with anyone.</p>
    </main>
  </body>
</html>
