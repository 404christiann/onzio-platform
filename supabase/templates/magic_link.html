<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to Onzio</title>
  </head>
  <body style="margin:0;padding:0;background:#f5f7f5;color:#172019;font-family:Arial,Helvetica,sans-serif">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;background:#f5f7f5">
      <tr>
        <td align="center" style="padding:32px 12px">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:520px;border-collapse:collapse;background:#ffffff">
            <tr>
              <td align="center" style="padding:34px 24px 0">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;background:#111b15;border-radius:12px">
                  <tr>
                    <td align="center" style="padding:13px 18px">
                      <img src="https://onzio-platform.vercel.app/images/onzio/onzio-wordmark-white-trimmed.png" width="126" height="33" alt="Onzio" style="display:block;width:126px;height:33px;border:0;color:#ffffff;font-size:17px;font-weight:700" />
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:48px 24px 0;font-size:30px;line-height:1.16;letter-spacing:-1.2px;font-weight:700;color:#172019">Sign in to Onzio</td>
            </tr>
            <tr>
              <td align="center" style="padding:14px 24px 0;font-size:15px;line-height:1.6;color:#5e6961">Enter this code in your admin portal.</td>
            </tr>
            <tr>
              <td align="center" style="padding:38px 12px;font-size:36px;line-height:1.15;font-weight:700;letter-spacing:0.14em;color:#172019;white-space:nowrap">{{ .Token }}</td>
            </tr>
            <tr>
              <td style="padding:0 28px">
                <div style="height:1px;background:#e4e9e4;font-size:1px;line-height:1px">&nbsp;</div>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:24px 28px 38px;font-size:12px;line-height:1.65;color:#758078">If you didn’t request this code, you can ignore this email.<br />Never share your code with anyone.</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
