<body>
  <div id="root"></div>
  <script>
    const params=new URLSearchParams(location.search),embedded=params.has('embedded');
    const players=[{id:'maya',name:'Maya Torres',number:9,position:'Forward'},{id:'avery',name:'Avery Shaw',number:8,position:'Midfielder'},{id:'alex',name:'Alex Chen',number:4,position:'Defender'},{id:'nora',name:'Nora Kim',number:1,position:'Goalkeeper'}];
    const directionCopy={A:{name:'Simple switch',intro:'Familiar tabs at the top. Pick Match stats or Season stats, then choose a player.',reason:'Recommended for everyday use. The switch stays in one predictable place, and the editing area stays familiar.'},B:{name:'Explained tabs',intro:'Two larger tabs explain the difference: one game or the whole season.',reason:'The clearest first visit. Short descriptions make the two kinds of stats easy to tell apart, with a little more space at the top.'},C:{name:'Player first',intro:'Choose a player first. Switch between their match stats and season totals.',reason:'Best when you work player by player. The switch sits with the player, so their name stays central as you change views.'}};
    const root=document.getElementById('root');
    if(!embedded){
      let direction='A',theme='light',screen=innerWidth<700?'phone':'both';
      root.innerHTML=`<main class="study"><div class="eyebrow">DESIGN STUDY · FICTIONAL MEADOW FC</div><h1>One Stats page. Two clear views.</h1><p class="study-intro">One place in the navigation for all player stats. Three ways to make the choice between an individual match and the full season feel obvious.</p><div class="directions" aria-label="Design directions">${Object.entries(directionCopy).map(([key,value])=>`<button class="direction" data-direction="${key}" aria-pressed="${key==='A'}"><span class="letter">${key}${key==='A'?' · RECOMMENDED':''}</span><strong>${value.name}</strong><span>${value.intro}</span></button>`).join('')}</div><div class="preview-tools"><p id="reason" class="reason"></p><div class="tool-fields"><label for="screen">Preview<select id="screen"><option value="both">Desktop + phone</option><option value="desktop">Desktop</option><option value="phone">Phone</option></select></label><label for="theme">Appearance<select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label></div></div><div class="views" id="views"><section class="desktop-view"><p class="view-label"><span>Desktop</span><span>Try the tabs, player search and stat controls</span></p><div class="frame"><iframe id="desktop" title="Desktop combined Stats prototype"></iframe></div></section><section class="phone-view"><p class="view-label"><span>Phone</span><span>Tap a player to open their stats</span></p><div class="frame"><iframe id="phone" title="Phone combined Stats prototype"></iframe></div></section></div><p class="study-note">Interactive sketches with fictional data. Demo saves stay in this page. All three keep match stats and manually entered season totals separate and protect unsaved edits when switching views. <a href="stats-workspace-review.html">View the current player workspace</a>.</p></main>`;
      document.getElementById('screen').value=screen;
      function frames(){for(const id of ['desktop','phone'])document.getElementById(id).src=`${location.pathname}?embedded=${direction}&theme=${theme}&device=${id}`;document.getElementById('reason').innerHTML=`<strong>${direction} · ${directionCopy[direction].name}.</strong> ${directionCopy[direction].reason}`;document.querySelectorAll('[data-direction]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.direction===direction)));document.getElementById('views').dataset.screen=screen;}
      document.querySelectorAll('[data-direction]').forEach(b=>b.addEventListener('click',()=>{direction=b.dataset.direction;frames()}));
      document.getElementById('screen').addEventListener('change',e=>{screen=e.target.value;document.getElementById('views').dataset.screen=screen});
      document.getElementById('theme').addEventListener('change',e=>{theme=e.target.value;document.body.classList.toggle('dark',theme==='dark');for(const id of ['desktop','phone'])document.getElementById(id).contentWindow.postMessage({type:'theme',theme},location.protocol==='file:'?'*':location.origin)});
      frames();
    }else{
      document.body.classList.add('embedded');document.body.classList.toggle('dark',params.get('theme')==='dark');
      const direction=params.get('embedded');document.title=`${direction} · ${directionCopy[direction]?.name||'Stats'} · Interactive sketch`;
      const state={mode:'match',player:'maya',detail:direction==='C',query:'',season:'2026',match:'harbor',values:{},saved:{},pending:null,status:''};
      const outfield=[['Playing time',[['starts','Starts','Matches started'],['mins','Minutes played','Time on the pitch']]],['Goals & assists',[['goals','Goals','Goals scored'],['assists','Assists','Goals you helped create']]],['Defending',[['tackles','Tackles',''],['offsides','Offsides',''],['fouls','Fouls committed',''],['fouls_suffered','Fouls suffered','']]],['Discipline',[['yellow','Yellow cards',''],['red','Red cards','']]]];
      const keeper=[['Playing time',outfield[0][1]],['Goalkeeping',[['goals_against','Goals against',''],['saves','Saves','Shots stopped'],['clean_sheets','Clean sheets','Matches without conceding']]],['Discipline',outfield[3][1]]];
      const matches={harbor:'Jun 10 · vs Harbor FC',river:'Jun 17 · vs River Athletic'};
      function scope(){return `${state.season}:${state.mode}:${state.mode==='match'?state.match:'total'}`}
      function ensure(){const key=scope();if(state.values[key])return;state.values[key]={};for(const p of players){const goal=p.id==='maya'?(state.mode==='match'?1:6):0;state.values[key][p.id]={starts:state.mode==='match'?true:10,mins:state.mode==='match'?90:900,goals:goal,assists:state.mode==='match'?0:4,tackles:state.mode==='match'?2:12,offsides:0,fouls:0,fouls_suffered:0,yellow:0,red:0,goals_against:state.mode==='match'?1:8,saves:state.mode==='match'?4:38,clean_sheets:state.mode==='match'?0:5}}state.saved[key]=structuredClone(state.values[key])}
      function dirty(){ensure();return JSON.stringify(state.values[scope()])!==JSON.stringify(state.saved[scope()])}
      function playerDirty(id){return JSON.stringify(state.values[scope()][id])!==JSON.stringify(state.saved[scope()][id])}
      function modeTabs(){const big=direction==='B';return `<div class="mode-tabs ${big?'explained-tabs':''}" role="tablist" aria-label="Stats view">${['match','season'].map(mode=>`<button id="tab-${mode}" role="tab" aria-selected="${state.mode===mode}" tabindex="${state.mode===mode?0:-1}" aria-controls="stats-panel" data-mode="${mode}">${big?'<span class="tab-dot" aria-hidden="true"></span><span>':''}${big?'<strong>':''}${mode==='match'?'Match stats':'Season stats'}${big?`</strong><small>${mode==='match'?'One game at a time':'Totals for the whole season'}</small></span>`:''}</button>`).join('')}</div>`}
      function scopeBox(){const match=state.mode==='match';return `<div class="scope-box"><div class="scope-copy"><h2>${match?'Match stats':'Season totals'}${direction==='C'?` for ${players.find(p=>p.id===state.player).name.split(' ')[0]}`:''}</h2><p>${match?'Enter what happened in this one match.':'Enter totals for the whole season. Saved separately from match stats.'}</p></div>${match?`<div class="match-select"><label for="match">Match<select id="match">${Object.entries(matches).map(([id,label])=>`<option value="${id}" ${state.match===id?'selected':''}>${label}</option>`).join('')}</select></label></div>`:'<span class="scope-tag">Whole season</span>'}</div>`}
      function shell(){ensure();root.innerHTML=`<div class="portal"><aside class="sidebar" aria-label="Preview navigation"><div><div class="brand">onzio</div><div class="club">Meadow FC</div></div><nav class="nav-block" aria-label="Admin"><div class="nav-item">Dashboard</div><div class="nav-label">Website</div><div class="nav-item">Homepage</div><div class="nav-label">Competition</div><div class="nav-item">Seasons</div><div class="nav-item">Roster</div><div class="nav-item">Schedule</div><div class="nav-item active" aria-current="page">Stats</div><div class="nav-item">Standings</div><div class="nav-item">Analytics</div></nav><div class="sidebar-bottom">Meadow FC · Design preview</div></aside><div class="main"><header class="app-top"><span class="desktop-crumb">Competition / <strong>Stats</strong></span><div class="mobile-menu"><button aria-label="Open preview navigation" id="menu">☰</button><strong>Stats</strong></div><div class="top-account"><span class="demo-badge">MEADOW FC</span><span class="avatar" aria-hidden="true">CA</span></div></header><main class="content"><div class="page-title"><div><h1>Stats</h1><p>${direction==='C'?'Choose a player. View a match or their season totals.':'Player stats for individual matches and the whole season.'}</p></div><label class="season-label" for="season">Season<select id="season"><option value="2026" ${state.season==='2026'?'selected':''}>2026–2027</option><option value="2025" ${state.season==='2025'?'selected':''}>2025–2026</option></select></label></div>${direction==='C'?'':modeTabs()}<div id="stats-panel" role="tabpanel" aria-labelledby="tab-${state.mode}">${direction==='C'?'':scopeBox()}<div class="workspace" data-detail="${state.detail}"><aside class="roster" aria-label="Players"><div class="roster-head"><h2>Players <span>4</span></h2><label for="search" class="sr-only">Search players</label><input type="search" id="search" placeholder="Find a player" value="${state.query.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}" autocomplete="off"></div><div id="player-list"></div></aside><section class="detail" aria-label="Selected player stats"><button class="back" id="back">‹ All players</button><div class="player-card"><div class="identity" id="identity"></div>${direction==='C'?`<div class="detail-mode">${modeTabs()}${scopeBox()}</div>`:''}<div class="fields" id="fields"></div></div></section></div></div></main><footer class="savebar"><div class="save-copy" role="status" aria-live="polite" id="save-status"></div><button class="primary" id="save">Save ${state.mode==='match'?'match stats':'season totals'}</button></footer></div></div><dialog id="switch-dialog" aria-labelledby="switch-title" aria-describedby="switch-copy"><h2 id="switch-title">Save your changes?</h2><p id="switch-copy">You have unsaved ${state.mode==='match'?'match stats':'season totals'}. Save them before switching, or discard these edits.</p><div class="dialog-actions"><button class="primary" data-decision="save">Save & switch</button><button class="discard" data-decision="discard">Discard changes</button><button data-decision="cancel">Cancel</button></div></dialog><dialog id="nav-dialog" aria-labelledby="nav-title"><h2 id="nav-title">Meadow FC</h2><div class="mobile-drawer"><button id="nav-stats">Stats · Match & season</button></div><p>This sketch shows the combined Stats page.</p><div class="dialog-actions"><button id="nav-close">Close</button></div></dialog>`;roster();editor();saveStatus();bind();}
      function roster(){const matching=players.filter(p=>`${p.name} ${p.number} ${p.position}`.toLowerCase().includes(state.query.trim().toLowerCase()));document.getElementById('player-list').innerHTML=matching.length?['Goalkeeper','Defender','Midfielder','Forward'].map(position=>{const group=matching.filter(p=>p.position===position);return group.length?`<div class="position">${position}s</div>${group.map(p=>`<button class="player" data-player="${p.id}" aria-label="Select ${p.name}" aria-pressed="${p.id===state.player}"><span class="number" aria-hidden="true">${p.number}</span><span><strong>${p.name}</strong><small>${p.position}</small></span>${playerDirty(p.id)?'<span class="dirty-dot" role="img" aria-label="Unsaved changes"></span>':''}<span class="chevron" aria-hidden="true">›</span></button>`).join('')}`:''}).join(''):'<p class="empty">No players found. Try a name or shirt number.</p>';document.querySelectorAll('[data-player]').forEach(b=>b.addEventListener('click',()=>{state.player=b.dataset.player;state.detail=true;shell();if(innerWidth<700){document.querySelector('.detail').scrollIntoView({block:'start'});document.getElementById('back').focus({preventScroll:true})}}))}
      function editor(){const p=players.find(p=>p.id===state.player),match=state.mode==='match';document.getElementById('identity').innerHTML=`<span class="number" aria-hidden="true">${p.number}</span><div><h2>${p.name}</h2><p>${p.position}${direction==='C'?'':` · ${match?matches[state.match]:'Season '+(state.season==='2026'?'2026–2027':'2025–2026')}`}</p></div>`;document.getElementById('fields').innerHTML=(p.position==='Goalkeeper'?keeper:outfield).map(([group,fields])=>`<fieldset class="field-group"><legend>${group}</legend><div class="field-grid">${fields.map(([key,label,hint])=>{const value=state.values[scope()][p.id][key],starter=key==='starts'&&match,id='field-'+key;return `<div class="field"><div class="field-copy"><label for="${id}">${starter?'Started the match':label}</label>${hint?`<small>${starter?'In the starting lineup':key==='mins'&&match?'0–300 minutes, including extra time':hint}</small>`:''}</div>${starter?`<label class="switch"><input type="checkbox" id="${id}" data-field="${key}" aria-label="${p.name}: started the match" ${value?'checked':''}></label>`:`<div class="stepper"><button data-step="-1" data-key="${key}" aria-label="Decrease ${p.name}: ${label}" ${Number(value)<=0?'disabled':''}>−</button><input id="${id}" type="number" min="0" ${match&&key==='mins'?'max="300"':''} inputmode="numeric" step="1" data-field="${key}" aria-label="${p.name}: ${label}" value="${Number(value)}"><button data-step="1" data-key="${key}" aria-label="Increase ${p.name}: ${label}" ${match&&key==='mins'&&Number(value)>=300?'disabled':''}>+</button></div>`}</div>`}).join('')}</div></fieldset>`).join('');bindFields()}
      function update(key,value){state.values[scope()][state.player][key]=value;state.status='';roster();saveStatus();const input=document.querySelector(`[data-field="${key}"]`);if(input&&input.type!=='checkbox'){input.value=value;input.previousElementSibling.disabled=Number(value)<=0;input.nextElementSibling.disabled=state.mode==='match'&&key==='mins'&&Number(value)>=300}}
      function bindFields(){document.querySelectorAll('[data-field]').forEach(input=>input.addEventListener('input',()=>{const limit=state.mode==='match'&&input.dataset.field==='mins'?300:Infinity;update(input.dataset.field,input.type==='checkbox'?input.checked:Math.min(limit,Math.max(0,Math.trunc(Number(input.value)))))}));document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{const limit=state.mode==='match'&&b.dataset.key==='mins'?300:Infinity;update(b.dataset.key,Math.min(limit,Math.max(0,Number(state.values[scope()][state.player][b.dataset.key])+Number(b.dataset.step))))}))}
      function saveStatus(){const changed=dirty();document.getElementById('save').disabled=!changed;const label=state.mode==='match'?matches[state.match]:'Season '+(state.season==='2026'?'2026–2027':'2025–2026');document.getElementById('save-status').innerHTML=`<strong>${state.status||(changed?'Unsaved '+(state.mode==='match'?'match stats':'season totals'):'All changes saved')}</strong><small>${label} · ${changed?'All edited players':'Demo data'}</small>`}
      function save(){state.saved[scope()]=structuredClone(state.values[scope()]);state.status=state.mode==='match'?'Match stats saved in demo':'Season totals saved in demo';roster();saveStatus()}
      function requestSwitch(next){if(dirty()){state.pending=next;document.getElementById('switch-dialog').showModal()}else apply(next)}
      function apply(next){Object.assign(state,next);state.status='';state.pending=null;shell();if(next.mode)document.getElementById('tab-'+state.mode).focus({preventScroll:true})}
      function bind(){document.querySelectorAll('[data-mode]').forEach(b=>{b.addEventListener('click',()=>{if(b.dataset.mode!==state.mode)requestSwitch({mode:b.dataset.mode})});b.addEventListener('keydown',event=>{let mode;if(['ArrowLeft','ArrowRight'].includes(event.key))mode=state.mode==='match'?'season':'match';if(event.key==='Home')mode='match';if(event.key==='End')mode='season';if(mode){event.preventDefault();if(mode!==state.mode)requestSwitch({mode})}})});document.getElementById('search').addEventListener('input',e=>{state.query=e.target.value;roster()});document.getElementById('back').addEventListener('click',()=>{state.detail=false;shell();document.querySelector('.roster').scrollIntoView({block:'start'});document.getElementById('search').focus({preventScroll:true})});for(const field of ['season','match'])document.getElementById(field)?.addEventListener('change',e=>{const value=e.target.value;e.target.value=state[field];requestSwitch({[field]:value})});document.getElementById('save').addEventListener('click',save);document.querySelectorAll('[data-decision]').forEach(b=>b.addEventListener('click',()=>{const next=state.pending,decision=b.dataset.decision;document.getElementById('switch-dialog').close();if(decision==='cancel'){state.pending=null;document.getElementById('tab-'+state.mode).focus();return}if(decision==='save')save();else state.values[scope()]=structuredClone(state.saved[scope()]);apply(next)}));document.getElementById('switch-dialog').addEventListener('cancel',()=>{state.pending=null});document.getElementById('menu').addEventListener('click',()=>document.getElementById('nav-dialog').showModal());for(const id of ['nav-close','nav-stats'])document.getElementById(id).addEventListener('click',()=>document.getElementById('nav-dialog').close())}
      addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='theme')document.body.classList.toggle('dark',e.data.theme==='dark')});
      function viewport(){const vv=visualViewport;document.documentElement.style.setProperty('--keyboard-bottom',`${vv?Math.max(0,innerHeight-vv.height-vv.offsetTop):0}px`);const field=document.activeElement;if(innerWidth<700&&field?.matches('[data-field]'))requestAnimationFrame(()=>{const box=field.getBoundingClientRect(),bar=document.querySelector('.savebar').getBoundingClientRect(),top=document.querySelector('.app-top').getBoundingClientRect().bottom;const change=box.bottom>bar.top-10?box.bottom-bar.top+10:box.top<top+10?box.top-top-10:0;if(change)scrollBy({top:change,behavior:'instant'})})}
      visualViewport?.addEventListener('resize',viewport);visualViewport?.addEventListener('scroll',viewport);addEventListener('resize',viewport);document.addEventListener('focusin',viewport);shell();viewport();
    }
  </script>
</body>
