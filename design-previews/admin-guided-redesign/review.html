<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guided admin portal review</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#24262a;background:#f5f5f7}*{box-sizing:border-box}body{margin:0}header{padding:28px max(20px,calc((100vw - 1440px)/2));background:white;border-bottom:1px solid #dedee3}h1{font-size:28px;letter-spacing:-.03em;margin:0 0 8px}p{margin:0;color:#60626a;line-height:1.5}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}label{display:grid;gap:5px;font-size:13px;font-weight:600}select{min-height:44px;border:1px solid #d3d4da;border-radius:10px;padding:0 36px 0 12px;background:white;color:#24262a;font:inherit;font-size:16px}button,a{min-height:44px}button{border:0;border-radius:10px;padding:12px 18px;font:inherit;font-size:14px;font-weight:600;background:#0071e3;color:white;cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #0071e3;outline-offset:3px}main{padding:24px;max-width:1520px;margin:auto}.caption{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:16px}.caption strong{font-size:18px}.caption a{display:inline-flex;align-items:center;color:#0061c4;font-size:14px}.canvas{border:1px solid #d9d9df;border-radius:14px;background:white;overflow:hidden;margin:auto;max-width:1440px;box-shadow:0 8px 32px #24262a09}.canvas.phone{max-width:390px}img{display:block;width:100%;height:auto}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:20px}.comparison .canvas.phone{width:100%}.error{padding:32px;display:none;color:#9b3028}@media(max-width:750px){.comparison{grid-template-columns:1fr}.caption{align-items:flex-start}header{padding:22px 20px}main{padding:20px}.controls{gap:10px}}
</style></head>
<body><header><h1>Guided admin portal</h1><p>Review the implemented design across all 19 pages. Captures use the same isolated Alpha FC test data.</p><div class="controls">
<label>Page<select id="route"></select></label>
<label>Screen<select id="screen"><option value="1440">Desktop</option><option value="390">Phone</option></select></label>
<label>Theme<select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label>
<label>View<select id="version"><option value="guided">Guided</option><option value="baseline">Before</option><option value="compare">Compare both</option></select></label>
</div></header><main id="views"></main>
<script>
const routes=[['dashboard','Dashboard'],['homepage','Homepage'],['programs','Programs'],['tryouts','Tryouts'],['shop','Shop'],['about','About'],['sponsors','Sponsors'],['contact','Contact'],['seasons','Seasons'],['roster','Roster'],['schedule','Schedule'],['stats','Match Stats'],['season-stats','Season Stats'],['standings','Standings'],['registrations','Registrations'],['analytics','Analytics'],['branding','Branding'],['members','Team Access'],['payments','Payments']];
const route=document.querySelector('#route'),screen=document.querySelector('#screen'),theme=document.querySelector('#theme'),version=document.querySelector('#version');
routes.forEach(([key,label])=>route.add(new Option(label,key)));
function render(){const versions=version.value==='compare'?['baseline','guided']:[version.value],views=document.querySelector('#views');views.className=versions.length===2?'comparison':'';views.replaceChildren();for(const value of versions){const section=document.createElement('section'),caption=document.createElement('div');caption.className='caption';const title=document.createElement('strong');title.textContent=(value==='guided'?'Guided':'Before')+' · '+routes.find(r=>r[0]===route.value)[1];const path=`evidence/${value}-${theme.value}/${route.value}-${screen.value}-${theme.value}.png`;const link=document.createElement('a');link.href=path;link.textContent='Open full capture';link.target='_blank';caption.append(title,link);const canvas=document.createElement('div');canvas.className='canvas'+(screen.value==='390'?' phone':'');const image=document.createElement('img');image.src=path;image.alt=`${title.textContent}, ${screen.value==='390'?'phone':'desktop'}, ${theme.value} theme`;canvas.append(image);section.append(caption,canvas);views.append(section)}}
[route,screen,theme,version].forEach(control=>control.addEventListener('change',render));render();
</script></body></html>
