<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>Onzio · Admin design directions</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202124; background: #f5f5f7; font-synthesis: none; --blue: #0068d9; --muted: #63666e; --line: #e4e5e9; --green: #247343; }
    * { box-sizing: border-box; }
    body { margin: 0; -webkit-tap-highlight-color: transparent; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
    button:active { opacity: .7; }
    button:disabled { opacity: .5; cursor: default; }
    button, a, input, textarea, select { outline-offset: 4px; }
    :focus-visible { outline: 3px solid #0068d9; }
    a { color: var(--blue); text-decoration: none; }
    svg { flex: none; width: 20px; height: 20px; vertical-align: middle; }
    h1,h2,h3,p { margin: 0; }
    h1,h2,h3 { text-wrap: balance; }
    p { text-wrap: pretty; }
    [hidden] { display: none !important; }
    .muted { color: var(--muted); }
    .brand { width: 78px; height: auto; object-fit: contain; }
    .review { max-width: 1600px; padding: 36px 40px 28px; margin: auto; }
    .review-heading { display: flex; gap: 24px; justify-content: space-between; align-items: flex-start; }
    .review-brand { display: flex; align-items: center; gap: 14px; margin-bottom: 19px; }
    .review-brand span { padding-left: 14px; border-left: 1px solid #c9ccd2; font-size: 13px; color: var(--muted); }
    .review-heading h1 { font-size: 32px; font-weight: 650; letter-spacing: -.035em; line-height: 1.15; }
    .review-heading p { margin-top: 10px; color: var(--muted); font-size: 15px; line-height: 1.6; max-width: 650px; }
    .sample-label { color: var(--muted); font-size: 12px; display: flex; gap: 7px; align-items: center; padding-top: 6px; white-space: nowrap; }
    .controls { margin-top: 27px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .segmented { display: inline-flex; gap: 3px; padding: 4px; border: 1px solid #dddfe5; border-radius: 12px; background: #e9ebef; }
    .segmented button { background: transparent; border: 0; border-radius: 8px; color: #60646c; font-size: 13px; min-height: 38px; padding: 8px 16px; font-weight: 550; }
    .segmented button[aria-pressed="true"] { color: #202124; background: #fff; box-shadow: 0 1px 4px #00000012; }
    .directions button { min-width: 164px; }
    .directions button span { color: var(--muted); font-weight: 450; margin-left: 5px; }
    .review-views { display: flex; gap: 12px; align-items: center; }
    .screen-select { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .screen-select select { min-height: 44px; border: 1px solid #dddfe5; border-radius: 10px; color: #24262b; background: #fff; padding: 7px 30px 7px 12px; }
    .concept-note { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin: 21px 0 22px; min-height: 50px; }
    .concept-note h2 { font-size: 16px; font-weight: 650; margin-bottom: 5px; }
    .concept-note p { font-size: 13px; line-height: 1.5; color: var(--muted); max-width: 760px; }
    .try-hint { font-size: 12px; color: #4c617b; background: #e8eef5; padding: 9px 12px; border-radius: 10px; max-width: 280px; line-height: 1.45; }
    .comparison { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 26px; align-items: start; }
    .frame-caption { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 11px; font-size: 12px; font-weight: 550; color: #626671; }
    .frame-caption span:last-child { font-weight: 400; }
    .desktop-window { overflow: hidden; border: 1px solid #d8dbe2; border-radius: 15px; background: #fff; box-shadow: 0 14px 44px #2126370b; }
    .window-chrome { height: 34px; border-bottom: 1px solid #e2e4ea; display: flex; align-items: center; gap: 6px; padding: 0 13px; position: relative; background: #fafbfc; }
    .window-chrome i { width: 8px; height: 8px; border-radius: 50%; background: #d6d9df; }
    .window-chrome span { position: absolute; left: 50%; transform: translateX(-50%); font-size: 10px; color: #737781; }
    .desktop-viewport { position: relative; overflow: hidden; }
    iframe { border: 0; display: block; background: #fff; }
    #desktop { width: 1120px; height: 850px; transform-origin: top left; }
    .phone-device { background: #fff; padding: 6px; border-radius: 36px; border: 1px solid #caced6; box-shadow: 0 14px 44px #2126370b; overflow: hidden; }
    .phone-viewport { border-radius: 30px; overflow: hidden; position: relative; }
    #phone { width: 390px; height: 844px; transform-origin: top left; }
    .comparison[data-view="desktop"] { grid-template-columns: minmax(0,1fr); }
    .comparison[data-view="desktop"] .phone-wrap { display: none; }
    .comparison[data-view="phone"] { grid-template-columns: 380px; justify-content: center; }
    .comparison[data-view="phone"] .desktop-wrap { display: none; }
    .review-footer { margin-top: 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; border-top: 1px solid #dedfe5; padding-top: 18px; }
    .review-footer p { font-size: 12px; line-height: 1.5; color: var(--muted); max-width: 600px; }
    .choice-button { white-space: nowrap; border: 1px solid #c6c9d0; border-radius: 10px; background: #fff; color: #292c31; font-size: 13px; min-height: 44px; padding: 10px 16px; }
    #preference-note { font-size: 12px; margin-top: 12px; text-align: right; color: var(--green); }
    .app { min-height: 100dvh; display: grid; grid-template-columns: 208px minmax(0,1fr); background: #fafafa; }
    .sidebar { position: sticky; top: 0; height: 100dvh; background: #f0f1f4; border-right: 1px solid #e5e6e9; padding: 25px 15px 15px; display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; }
    .club { display: flex; gap: 10px; align-items: center; margin: 0 6px 31px; }
    .club-mark { width: 34px; height: 38px; background: #183c32; border-radius: 9px 9px 13px 13px; display: grid; place-items: center; color: white; font-weight: 700; font-size: 11px; letter-spacing: -.03em; }
    .club strong { font-size: 13px; font-weight: 650; display: block; }
    .club small { display: block; color: #6a6d75; font-size: 11px; margin-top: 3px; }
    .navigation { display: flex; flex-direction: column; gap: 3px; }
    .nav-item, .nav-group { min-height: 43px; display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 10px; border: 0; background: transparent; color: #494d57; font-size: 13px; border-radius: 8px; font-weight: 500; }
    .nav-item svg,.nav-group svg { width: 18px; height: 18px; color: #686e78; stroke-width: 1.7; }
    .nav-item[aria-current="page"] { background: #fff; color: #22252b; box-shadow: 0 1px 4px #20232b09; font-weight: 600; }
    .nav-item[aria-current="page"] svg { color: var(--blue); }
    .nav-group .chevron { margin-left: auto; width: 13px; height: 13px; }
    .nav-group[aria-expanded="true"] .chevron { transform: rotate(90deg); }
    .nav-children { padding-left: 19px; }
    .nav-children .nav-item { min-height: 35px; padding-top: 7px; padding-bottom: 7px; font-size: 12px; }
    .nav-children svg { width: 16px; height: 16px; }
    .sidebar-bottom { margin-top: auto; padding: 28px 8px 0; }
    .sidebar-bottom .brand { width: 62px; margin-top: 16px; opacity: .55; }
    .account { display: flex; align-items: center; gap: 9px; font-size: 12px; color: #4b5059; }
    .avatar { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: #dadde4; color: #3e4654; font-size: 11px; font-weight: 600; flex: none; }
    .app-body { min-width: 0; }
    .topbar { height: 63px; display: flex; align-items: center; justify-content: space-between; padding: 0 34px; border-bottom: 1px solid #ededf0; background: #ffffffd9; backdrop-filter: blur(16px); position: sticky; top: 0; z-index: 2; }
    .topbar-title { font-size: 13px; font-weight: 550; color: #50545c; display: flex; align-items: center; gap: 10px; }
    .topbar-right { display: flex; align-items: center; gap: 17px; font-size: 11px; color: #777b83; }
    .demo-indicator { display: inline-flex; align-items: center; gap: 6px; }
    .demo-indicator::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: #9ba1ab; }
    .text-button { border: 0; background: transparent; color: var(--blue); padding: 8px 0; font-size: 13px; min-height: 40px; font-weight: 550; display: inline-flex; align-items: center; gap: 6px; }
    .text-button svg { width: 15px; height: 15px; }
    .icon-button { border: 0; background: transparent; width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 10px; color: #454a54; }
    .mobile-menu { display: none; }
    .phone-status { display: none; }
    .content { padding: 35px 34px 44px; max-width: 1100px; margin: auto; }
    .page-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 30px; }
    .page-head h1 { font-size: 31px; font-weight: 650; letter-spacing: -.035em; line-height: 1.16; }
    .page-head p { color: var(--muted); font-size: 13px; margin-top: 8px; line-height: 1.6; }
    .button { min-height: 43px; padding: 10px 16px; font-size: 13px; font-weight: 550; color: #fff; background: var(--blue); border: 1px solid transparent; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
    .button svg { width: 16px; height: 16px; }
    .button.secondary { background: #fff; border-color: #d7dae1; color: #303741; }
    .status { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: #2e6944; background: #eaf3ec; padding: 5px 9px; border-radius: 6px; white-space: nowrap; }
    .status::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: #398451; }
    .section-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 12px; }
    .section-title h2 { font-size: 16px; font-weight: 600; letter-spacing: -.015em; }
    .section-title .text-button { font-size: 12px; min-height: 32px; }
    .task-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; }
    .task-card { text-align: left; background: #fff; border: 1px solid #e4e6eb; border-radius: 14px; padding: 20px 18px 17px; display: flex; flex-direction: column; align-items: flex-start; min-height: 151px; box-shadow: 0 2px 3px #00000002; }
    .task-icon { color: var(--blue); width: 34px; height: 34px; background: #edf3fc; border-radius: 9px; display: grid; place-items: center; margin-bottom: 18px; }
    .task-icon svg { width: 19px; height: 19px; stroke-width: 1.65; }
    .task-copy { display: block; }
    .task-card strong { display: block; font-size: 14px; font-weight: 600; }
    .task-card small { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); line-height: 1.4; }
    .home-columns { display: grid; grid-template-columns: minmax(0,1.22fr) minmax(0,1fr); gap: 26px; margin-top: 32px; }
    .surface { border: 1px solid #e4e6eb; border-radius: 14px; background: #fff; overflow: hidden; }
    .event-row { display: flex; align-items: center; gap: 13px; padding: 17px; border-bottom: 1px solid #eeeef1; }
    .event-row:last-child { border: 0; }
    .date-square { background: #f0f2f5; border-radius: 9px; width: 44px; height: 49px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none; }
    .date-square small { font-size: 9px; color: #737981; line-height: 1.5; }
    .date-square strong { font-size: 19px; font-weight: 600; line-height: 1.2; }
    .event-info { flex: 1; min-width: 0; }
    .event-info strong { font-size: 12px; font-weight: 600; display: block; line-height: 1.4; }
    .event-info p { color: var(--muted); font-size: 11px; margin-top: 5px; line-height: 1.5; }
    .event-row .icon-button { width: 30px; height: 40px; }
    .website-summary { padding: 21px; }
    .website-summary .website-address { margin: 13px 0 18px; font-size: 13px; font-weight: 550; }
    .website-summary p { font-size: 12px; line-height: 1.7; color: var(--muted); }
    .website-summary .text-button { margin-top: 9px; }
    .season-line { display: flex; align-items: center; gap: 20px; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--line); color: #656a73; font-size: 12px; flex-wrap: wrap; }
    .season-line span:first-child { margin-right: auto; font-weight: 550; color: #3c414a; }
    .season-line strong { color: #292e36; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 5px; }
    .guided-intro { text-align: center; padding: 16px 0 30px; }
    .guided-intro .club-mark { margin: 0 auto 16px; width: 42px; height: 47px; font-size: 13px; }
    .guided-intro h1 { font-size: 34px; font-weight: 650; letter-spacing: -.04em; line-height: 1.2; }
    .guided-intro p { font-size: 14px; color: var(--muted); line-height: 1.6; margin-top: 10px; }
    .guided-actions { max-width: 610px; margin: auto; }
    .guided-actions .row-action { min-height: 87px; }
    .row-action { width: 100%; text-align: left; display: flex; align-items: center; gap: 17px; padding: 19px 21px; background: #fff; border: 0; border-bottom: 1px solid #e9e9ed; color: #23272e; }
    .row-action:last-child { border-bottom: 0; }
    .row-action .task-icon { margin: 0; width: 43px; height: 43px; border-radius: 11px; }
    .row-action .row-copy { flex: 1; min-width: 0; }
    .row-copy strong { display: block; font-size: 16px; font-weight: 600; }
    .row-copy small { display: block; font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.5; }
    .row-action > svg { width: 17px; height: 17px; color: #969aa2; }
    .guided-after { max-width: 610px; margin: 30px auto 0; }
    .guided-after .event-row { padding: 18px 20px; }
    .guided-after .event-info strong { font-size: 13px; }
    .direction-b .app { background: #f5f5f7; }
    .direction-b .sidebar { background: #eceef2; }
    .direction-b .content { padding-top: 30px; }
    .direction-b .surface { border: 0; border-radius: 17px; }
    .direction-b .page-head { margin-bottom: 26px; }
    .direction-b .page-head h1 { font-size: 34px; }
    .direction-b .page-head p { font-size: 14px; }
    .direction-b .button { min-height: 46px; border-radius: 12px; }
    .toolbar { display: flex; gap: 14px; align-items: center; justify-content: space-between; margin-bottom: 17px; }
    .search { position: relative; flex: 1; max-width: 310px; }
    .search svg { position: absolute; left: 12px; top: 12px; width: 17px; height: 17px; color: #7b8089; }
    .search input { width: 100%; min-height: 42px; padding: 10px 12px 10px 38px; border: 1px solid #dcdfe6; border-radius: 10px; background: #fff; font-size: 13px; color: #23272d; }
    .filter-label { color: var(--muted); font-size: 12px; }
    .list-heading { display: grid; grid-template-columns: minmax(0,1fr) 120px 75px 65px; gap: 10px; padding: 12px 18px; border-bottom: 1px solid #e8e9ed; color: #6c727c; font-size: 11px; background: #fbfbfc; }
    .player-row { display: grid; grid-template-columns: minmax(0,1fr) 120px 75px 65px; gap: 10px; align-items: center; padding: 14px 18px; width: 100%; border: 0; border-bottom: 1px solid #eeeef2; background: #fff; text-align: left; }
    .player-row:last-child { border-bottom: 0; }
    .player-person { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .player-avatar { border-radius: 50%; width: 38px; height: 38px; display: grid; place-items: center; background: #e8edf3; color: #536176; font-weight: 600; font-size: 12px; flex: none; }
    .player-person strong { display: block; font-size: 13px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; }
    .player-person small { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .player-position { font-size: 12px; color: #565e68; }
    .player-number { font-size: 12px; color: #4d5460; font-variant-numeric: tabular-nums; }
    .player-edit { color: var(--blue); font-size: 12px; text-align: right; }
    .roster-note { font-size: 12px; color: var(--muted); margin-top: 17px; line-height: 1.6; }
    .direction-b .roster-area { max-width: 660px; margin: auto; }
    .direction-b .list-heading { display: none; }
    .direction-b .player-row { padding: 19px 21px; grid-template-columns: minmax(0,1fr) 120px 20px; }
    .direction-b .player-avatar { width: 44px; height: 44px; border-radius: 12px; }
    .direction-b .player-person strong { font-size: 15px; }
    .direction-b .player-person small { font-size: 12px; }
    .direction-b .player-number { display: none; }
    .direction-b .player-edit { font-size: 0; }
    .direction-b .player-edit::after { content: '›'; font-size: 25px; color: #969aa2; }
    .editor-heading { display: flex; gap: 10px; align-items: center; }
    .editor-layout { display: grid; grid-template-columns: minmax(0,1fr) 245px; gap: 20px; }
    .site-canvas { background: #fff; border: 1px solid #e1e4e9; border-radius: 13px; overflow: hidden; }
    .site-header { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; background: #fff; border-bottom: 1px solid #edf0f2; font-weight: 650; font-size: 11px; color: #204339; }
    .site-header small { color: #6b7377; font-size: 8px; font-weight: 450; }
    .site-hero { background: #173f33; padding: 44px 26px 42px; color: #fff; position: relative; }
    .site-hero h2 { font-size: 37px; line-height: 1.05; font-weight: 700; letter-spacing: -.04em; max-width: 320px; }
    .site-hero p { margin-top: 15px; font-size: 12px; color: #d0ded7; line-height: 1.7; max-width: 300px; }
    .site-hero .site-cta { display: inline-block; padding: 10px 14px; background: #fff; color: #204339; font-size: 10px; font-weight: 600; border-radius: 5px; margin-top: 23px; }
    .edit-overlay { position: absolute; right: 12px; top: 12px; border: 1px solid #d4e2dc5e; background: #ffffff18; padding: 6px 10px; border-radius: 6px; color: #fff; font-size: 10px; min-height: 32px; display: flex; align-items: center; gap: 6px; }
    .edit-overlay svg { width: 12px; height: 12px; }
    .site-story { padding: 25px 24px; position: relative; }
    .site-story h3 { font-size: 22px; font-weight: 650; color: #204339; letter-spacing: -.025em; }
    .site-story p { margin-top: 12px; font-size: 11px; line-height: 1.8; color: #6b7474; max-width: 320px; }
    .canvas-note { padding: 13px 16px; background: #f7f8fa; color: #737984; font-size: 10px; border-top: 1px solid #e6e9ee; }
    .inspector { align-self: start; background: #fff; border: 1px solid #e2e5eb; border-radius: 13px; padding: 20px 18px; }
    .inspector h2 { font-size: 15px; font-weight: 600; }
    .inspector > p { font-size: 11px; color: var(--muted); line-height: 1.65; margin: 7px 0 21px; }
    .field { margin: 0 0 18px; }
    .field label { display: block; font-size: 12px; font-weight: 550; margin-bottom: 8px; color: #3e444f; }
    .field input,.field textarea,.field select { width: 100%; border: 1px solid #d8dce4; border-radius: 9px; padding: 10px 11px; background: #fff; color: #292e36; font-size: 14px; min-height: 43px; line-height: 1.5; }
    .field textarea { resize: vertical; min-height: 100px; }
    .field small { display: block; color: var(--muted); font-size: 11px; line-height: 1.6; margin-top: 7px; }
    .field .field-error { color: #a32b26; }
    .inspector .button { width: 100%; }
    .local-feedback { font-size: 12px; color: var(--green); line-height: 1.6; margin-top: 12px; }
    .editor-help { font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 19px; }
    .direction-b .editor-layout { grid-template-columns: minmax(0,1fr); max-width: 650px; margin: auto; }
    .direction-b .inspector { display: none; }
    .direction-b .site-hero { padding: 55px 39px; }
    .direction-b .site-hero h2 { font-size: 47px; }
    .direction-b .site-hero p { font-size: 14px; }
    .direction-b .edit-overlay { background: #fff; color: #204339; font-size: 12px; padding: 8px 12px; }
    .direction-b .site-story { padding: 29px 39px; }
    .editor-mobile-control { display: none; }
    dialog { border: 0; padding: 0; color: #252932; box-shadow: 0 22px 85px #14213030; }
    dialog::backdrop { background: #16203236; backdrop-filter: blur(3px); }
    .edit-dialog { width: 400px; max-width: calc(100% - 24px); height: 100dvh; max-height: 100dvh; margin: 0 0 0 auto; border-radius: 0; background: #fafafa; }
    .dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 20px 25px 17px; border-bottom: 1px solid #e6e8ed; background: #fff; }
    .dialog-head h2 { font-size: 19px; font-weight: 650; letter-spacing: -.02em; }
    .dialog-head p { font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.5; }
    .dialog-scroll { padding: 26px; overflow-y: auto; flex: 1; min-height: 0; overscroll-behavior: contain; }
    .dialog-layout { height: 100%; display: flex; flex-direction: column; }
    .dialog-foot { border-top: 1px solid #e3e6ed; padding: 18px 26px; padding-bottom: calc(18px + env(safe-area-inset-bottom,0px)); background: #fff; }
    .dialog-foot .button { width: 100%; }
    .dialog-foot p { font-size: 11px; text-align: center; color: var(--muted); margin-top: 10px; line-height: 1.5; }
    .direction-b .edit-dialog { margin: auto; height: auto; max-height: calc(100dvh - 60px); border-radius: 22px; width: 450px; }
    .direction-b .dialog-layout { max-height: calc(100dvh - 60px); }
    .direction-b .dialog-head { padding: 22px 26px; }
    .direction-b .dialog-scroll { background: #f5f5f7; }
    .direction-b .field { margin-bottom: 16px; }
    .nav-dialog { width: 320px; max-width: 88%; height: 100dvh; max-height: 100dvh; margin: 0 auto 0 0; background: #f0f1f4; }

    .nav-dialog .dialog-head { padding: 8px 15px 0; border: 0; background: transparent; justify-content: flex-end; }

    .toast svg { color: var(--green); width: 17px; height: 17px; }
    .empty { padding: 30px; text-align: center; font-size: 13px; line-height: 1.6; color: var(--muted); }
    .app-footer { margin-top: 34px; color: #81858d; font-size: 10px; line-height: 1.6; }

      .event-info p { font-size: 12px; }

      .guided-intro p { font-size: 13px; }
      .guided-intro .club-mark { margin-bottom: 18px; }

      .row-copy strong { font-size: 15px; }
      .row-copy small { font-size: 12px; }

      .direction-b .page-head p { font-size: 13px; }

      .filter-label { display: none; }

      .roster-head .button { width: 100%; min-height: 46px; font-size: 14px; }
      .list-heading { display: none; }
      .player-row { grid-template-columns: minmax(0,1fr) 28px; padding: 16px; }

function initReview() {
  document.body.innerHTML = `<main class="review">
    <div class="review-brand"><img class="brand" src="${LOGO}" alt="Onzio"><span>Admin portal exploration</span></div>
    <div class="review-heading"><div><h1>A simpler place to run your club.</h1><p>Two Apple-inspired directions. Familiar controls, plain language, and a little more room to breathe.</p></div><div class="sample-label">${icon('FlaskConical')} Interactive preview · Sample data</div></div>
    <div class="controls"><div class="segmented directions" aria-label="Design direction"><button data-direction="a" aria-pressed="true">A <span>Workspace</span></button><button data-direction="b" aria-pressed="false">B <span>Guided</span></button></div>
    <div class="review-views"><label class="screen-select"><span>Try a screen</span><select id="screen-select"><option value="dashboard">Dashboard</option><option value="roster">Roster</option><option value="homepage">Homepage editor</option></select></label><div class="segmented" aria-label="Preview layout"><button data-view="both" aria-pressed="true">Both</button><button data-view="desktop" aria-pressed="false">Desktop</button><button data-view="phone" aria-pressed="false">Phone</button></div></div></div>
    <div class="concept-note"><div><h2 id="concept-title">A · A familiar workspace</h2><p id="concept-description">A steady sidebar, useful shortcuts, and a quiet overview. Good for staff who regularly move between the website, roster, and schedule.</p></div><div class="try-hint" id="try-hint">Try “Manage roster,” edit a player, then save your changes.</div></div>
    <section class="comparison" data-view="both" aria-label="Interactive desktop and phone previews">
    <div class="desktop-wrap"><div class="frame-caption"><span>Desktop</span><span>Full navigation · Room to work</span></div><div class="desktop-window"><div class="window-chrome"><i></i><i></i><i></i><span>Onzio / Rose City FC</span></div><div class="desktop-viewport"><iframe id="desktop" title="Desktop admin preview"></iframe></div></div></div>
    <div class="phone-wrap"><div class="frame-caption"><span>Phone</span><span>Touch controls · Simple tasks</span></div><div class="phone-device"><div class="phone-viewport"><iframe id="phone" title="Phone admin preview"></iframe></div></div></div>
    </section>
    <footer class="review-footer"><p>Try navigating, searching the roster, and editing text. Changes stay in this preview. Screens use fictional club content.</p><button id="choose-direction" class="choice-button">Mark A as my preference</button></footer><p id="preference-note" role="status"></p>
    </main>`;
  const urls = () => { for(const id of ['desktop','phone']) document.getElementById(id).src = `${location.pathname}?app=1&direction=${direction}&screen=${screen}`; };
  urls();
  document.querySelectorAll('[data-direction]').forEach(button => button.addEventListener('click', () => {
    if(direction === button.dataset.direction) return;
    direction = button.dataset.direction;
    document.querySelectorAll('[data-direction]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.direction === direction)));
    document.getElementById('concept-title').textContent = direction === 'a' ? 'A · A familiar workspace' : 'B · One clear choice at a time';
    document.getElementById('concept-description').textContent = direction === 'a' ? 'A steady sidebar, useful shortcuts, and a quiet overview. Good for staff who regularly move between the website, roster, and schedule.' : 'Larger choices, helpful descriptions, and focused editing. Good for occasional users who appreciate a little guidance.';
    document.getElementById('choose-direction').textContent = `Mark ${direction.toUpperCase()} as my preference`;
    urls();
  }));
  document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => {
    document.querySelector('.comparison').dataset.view = button.dataset.view;
    document.querySelectorAll('[data-view]').forEach(b => { if(b.tagName === 'BUTTON') b.setAttribute('aria-pressed', String(b.dataset.view === button.dataset.view)); });
    sizeFrames();
  }));
  document.getElementById('screen-select').addEventListener('change', e => { screen = e.target.value; urls(); updateHint(); });
  function updateHint(){ document.getElementById('try-hint').textContent = screen === 'homepage' ? 'Try “Edit text,” change the heading, and save the preview.' : screen === 'roster' ? 'Search for Alex, edit their number, and save your changes.' : 'Try “Manage roster,” edit a player, then save your changes.'; }
  document.getElementById('choose-direction').addEventListener('click', () => {
    try { localStorage.setItem('onzio-preview-preference',direction); } catch {}
    document.getElementById('preference-note').textContent = `${direction.toUpperCase()} saved as your preference in this browser. Tell the chat which direction you chose.`;
  });
  window.addEventListener('message', e => {
    const frames = [document.getElementById('desktop'),document.getElementById('phone')];
    if(!frames.some(f => f.contentWindow === e.source) || e.data?.type !== 'onzio-preview-screen' || !['dashboard','roster','homepage'].includes(e.data.screen)) return;
    screen = e.data.screen;
    document.getElementById('screen-select').value = screen;
    updateHint();
    frames.forEach(f => { if(f.contentWindow !== e.source) f.contentWindow.postMessage({type:'onzio-preview-navigate',screen},'*'); });
  });
  function sizeFrames() {
    const desktop = document.getElementById('desktop');
    const phone = document.getElementById('phone');
    const desktopWidth = desktop.parentElement.clientWidth;
    if(desktopWidth){desktop.style.transform = `scale(${desktopWidth/1120})`; desktop.parentElement.style.height = `${850*desktopWidth/1120}px`;}
    const phoneWidth = phone.parentElement.clientWidth;
    if(phoneWidth){phone.style.transform = `scale(${phoneWidth/390})`; phone.parentElement.style.height = `${844*phoneWidth/390}px`;}
  }
  const observer = new ResizeObserver(sizeFrames);
  observer.observe(document.querySelector('.comparison'));
  observer.observe(document.querySelector('.phone-viewport'));
  requestAnimationFrame(sizeFrames);
}

function initApp() {
  document.body.className = `direction-${direction}`;
  document.body.innerHTML = `<div class="app"><aside class="sidebar" id="desktop-sidebar"></aside><div class="app-body"><div class="phone-status" aria-hidden="true"><span>9:41</span><span class="status-icons">${icon('Signal')}${icon('Wifi')}${icon('BatteryFull')}</span></div><header class="topbar"><div class="topbar-title"><button class="icon-button mobile-menu" aria-label="Open navigation" data-action="menu">${icon('Menu')}</button><span id="current-screen">Dashboard</span></div><div class="topbar-right"><span class="demo-indicator">Sample club</span><button class="text-button" data-action="view-site">View website ${icon('ArrowUpRight')}</button></div></header><main class="content" id="page-content"></main></div></div>
  <dialog class="nav-dialog" id="nav-dialog" aria-label="Club navigation"><div class="dialog-head"><button class="icon-button" data-action="close-nav" aria-label="Close navigation">${icon('X')}</button></div><div class="sidebar" id="mobile-sidebar"></div></dialog>
  <dialog class="edit-dialog" id="edit-dialog" aria-labelledby="edit-title"></dialog>
  <dialog class="discard-dialog" id="discard-dialog" aria-labelledby="discard-title"><h2 id="discard-title">Keep your changes?</h2><p>You have changes that haven’t been saved in this preview.</p><div class="discard-actions"><button class="button" data-action="keep-editing">Keep editing</button><button class="button secondary" data-action="discard">Discard changes</button></div></dialog>
  <div class="toast" id="toast" role="status" hidden></div>`;
  renderNavigation(); renderPage();
  document.addEventListener('click', handleClick);
  document.addEventListener('input', handleInput);
  document.getElementById('edit-dialog').addEventListener('cancel', e => { e.preventDefault(); closeEditor(); });
  document.getElementById('nav-dialog').addEventListener('click', e => { if(e.target === e.currentTarget) e.currentTarget.close(); });
  window.addEventListener('message', e => { if(e.source === parent && e.data?.type === 'onzio-preview-navigate') navigate(e.data.screen, false); });
}

function renderNavigation() {
  function item(label){ const active = available[label] === screen; return `<button class="nav-item" ${active ? 'aria-current="page"' : ''} data-route="${esc(label)}">${icon(routeIcons[label])}<span>${esc(label)}</span></button>`; }
  function navGroup(label){const opened = group === label;const key=label.replaceAll(' ','-');return `<button class="nav-group" data-group="${esc(label)}" aria-expanded="${opened}" aria-controls="children-${key}-__PLACE__">${icon(label==='Website'?'Globe2':label==='Competition'?'Trophy':'Settings2')}<span>${label}</span>${ICONS.ChevronRight.replace('class="','class="chevron ')}</button><div class="nav-children" id="children-${key}-__PLACE__" ${opened?'':'hidden'}>${groups[label].map(item).join('')}</div>`;}
  const navigation = `<div class="club"><div class="club-mark" aria-hidden="true">RC</div><div><strong>Rose City FC</strong><small>Club administration</small></div></div><nav class="navigation" aria-label="Main navigation">${item('Dashboard')}${navGroup('Website')}${navGroup('Competition')}${item('Registrations')}${item('Analytics')}${navGroup('Club Settings')}${item('Payments')}</nav><div class="sidebar-bottom"><div class="account"><span class="avatar">JL</span><span>Jamie Lee<br><small class="muted">Club owner</small></span></div><img class="brand" src="${LOGO}" alt="Onzio"></div>`;
  document.getElementById('desktop-sidebar').innerHTML = navigation.replaceAll('__PLACE__','desktop');
  document.getElementById('mobile-sidebar').innerHTML = navigation.replaceAll('__PLACE__','mobile');
}

function pageFooter(){return `<p class="app-footer">Interactive design preview. Fictional data; nothing is published to a club website.</p>`;}
function taskCard(action, name, description, glyph){return `<button class="task-card" data-go="${action}"><span class="task-icon">${icon(glyph)}</span><span class="task-copy"><strong>${name}</strong><small>${description}</small></span></button>`;}
function rowAction(action, name, description, glyph){return `<button class="row-action" data-go="${action}"><span class="task-icon">${icon(glyph)}</span><span class="row-copy"><strong>${name}</strong><small>${description}</small></span>${icon('ChevronRight')}</button>`;}
function eventRows(){return `<div class="event-row"><div class="date-square"><small>Oct</small><strong>17</strong></div><div class="event-info"><strong>Rose City vs. Riverside FC</strong><p>Saturday, 3:00 PM · Home match</p></div><button class="icon-button" data-action="sample-event" aria-label="View home match details">${icon('ChevronRight')}</button></div><div class="event-row"><div class="date-square"><small>Oct</small><strong>21</strong></div><div class="event-info"><strong>Open training</strong><p>Wednesday, 6:30 PM · City Park</p></div><button class="icon-button" data-action="sample-event" aria-label="View training details">${icon('ChevronRight')}</button></div>`;}
function renderPage() {
  document.getElementById('current-screen').textContent = {dashboard:'Dashboard',roster:'Roster',homepage:'Homepage'}[screen];
  const content = document.getElementById('page-content');
  if(screen === 'dashboard') content.innerHTML = direction === 'a' ? dashboardA() : dashboardB();
  if(screen === 'roster') content.innerHTML = rosterPage();
  if(screen === 'homepage') content.innerHTML = homepagePage();
}
function dashboardA(){return `<div class="page-head"><div><h1>Welcome back, Jamie.</h1><p>Your club’s next steps, all in one place.</p></div><span class="status">Website is live</span></div><section><div class="section-title"><h2>What would you like to do?</h2></div><div class="task-grid">${taskCard('homepage','Update your website','Edit text and page content.','PanelTop')}${taskCard('roster','Manage roster','Add players or update details.','Users')}${taskCard('schedule','Update schedule','Keep match information current.','CalendarDays')}</div></section><div class="home-columns"><section><div class="section-title"><h2>Coming up</h2><button class="text-button" data-go="schedule">Full schedule ${icon('ChevronRight')}</button></div><div class="surface">${eventRows()}</div></section><section><div class="section-title"><h2>Your website</h2></div><div class="surface website-summary"><span class="status">Website is live</span><p class="website-address">rosecity.example</p><p>Your website is ready for supporters. Update the homepage whenever your club has something new to share.</p><button class="text-button" data-go="homepage">Edit homepage ${icon('ChevronRight')}</button></div></section></div><div class="season-line"><span>2026 season</span><span><strong>${players.length}</strong> sample players</span><span><strong>2</strong> upcoming events</span></div>${pageFooter()}`;}
function dashboardB(){return `<div class="guided-intro"><div class="club-mark" aria-hidden="true">RC</div><h1>What would you like to do?</h1><p>A few simple ways to keep Rose City moving.</p></div><div class="surface guided-actions">${rowAction('homepage','Update your website','Change what supporters see on your homepage.','PanelTop')}${rowAction('roster','Manage your players','Add someone new or update player details.','Users')}${rowAction('schedule','Update your schedule','Add a match or change a time and location.','CalendarDays')}</div><section class="guided-after"><div class="section-title"><h2>Next for your club</h2><button class="text-button" data-go="schedule">See all ${icon('ChevronRight')}</button></div><div class="surface">${eventRows()}</div><div class="season-line"><span class="status">Website is live</span><button class="text-button" data-action="view-site">View website ${icon('ArrowUpRight')}</button></div>${pageFooter()}</section>`;}
function rosterPage(){return `<div class="roster-area"><div class="page-head roster-head"><div><h1>${direction==='a'?'Roster':'Your players'}</h1><p>${direction==='a'?'2026 season · Choose a player to edit their details.':'Add a player, or choose someone to update their details.'}</p></div><button class="button" data-action="add-player">${icon('Plus')} Add player</button></div><div class="toolbar"><label class="search">${icon('Search')}<input id="player-search" type="search" placeholder="Find a player" aria-label="Find a player"></label><span class="filter-label" id="player-count">${players.length} players</span></div><div class="surface"><div class="list-heading"><span>Player</span><span>Position</span><span>Number</span><span></span></div><div id="player-list">${playerRows(players)}</div></div><p class="roster-note">Player details appear on your club’s public roster after you save.</p>${pageFooter()}</div>`;}
function playerRows(list){return list.length?list.map(p=>`<button class="player-row" data-player="${p.id}" aria-label="Edit ${esc(p.name)}"><span class="player-person"><span class="player-avatar" style="background:${p.color}">${esc(p.initials)}</span><span><strong>${esc(p.name)}</strong><small>${esc(p.position)} · #${esc(p.number)}</small></span></span><span class="player-position">${esc(p.position)}</span><span class="player-number">${esc(p.number)}</span><span class="player-edit">Edit</span></button>`).join(''):`<div class="empty">No players match your search.<br>Try another name or shirt number.</div>`;}
function homepagePage(){return `<div class="page-head editor-head"><div><div class="editor-heading"><h1>Homepage</h1><span class="status">Preview</span></div><p>${direction==='a'?'Edit your text and see it in place.':'Tap Edit text to change your homepage.'}</p></div><button class="button secondary" data-go="dashboard">Done</button></div><div class="editor-layout"><div><div class="site-canvas"><div class="site-header"><span>Rose City FC</span><small>Home &nbsp; Roster &nbsp; Schedule</small></div><div class="site-hero"><button class="edit-overlay" data-action="edit-homepage">${icon('Pencil')} Edit text</button><h2 id="canvas-title">${esc(homepageDraft.title)}</h2><p id="canvas-description">${esc(homepageDraft.description)}</p><span class="site-cta">Discover our club</span></div><div class="site-story"><h3>A club for our community.</h3><p>${esc(homepage.story)}</p></div><div class="canvas-note">Sample website · Your changes appear here as you type</div></div><div class="editor-mobile-control"><button class="button" data-action="edit-homepage">${icon('Pencil')} Edit homepage text</button></div><p class="editor-help">Your changes are ready when you choose Save changes.</p></div><aside class="inspector"><h2>Homepage text</h2><p>These words are the first thing supporters see.</p>${homepageFields('inline')}<button class="button" data-action="save-homepage-inline" ${homepageUnsaved?'':'disabled'}>Save changes</button><p class="local-feedback" id="inline-feedback" role="status"></p></aside></div>${pageFooter()}`;}
function homepageFields(prefix){return `<div class="field"><label for="${prefix}-title">Heading</label><textarea id="${prefix}-title" name="homepage-title" maxlength="100">${esc(homepageDraft.title)}</textarea><small>Keep it short and easy to read.</small><p class="field-error" id="${prefix}-title-error" role="alert" hidden>Add a heading before saving.</p></div><div class="field"><label for="${prefix}-description">Description</label><textarea id="${prefix}-description" name="homepage-description" maxlength="240">${esc(homepageDraft.description)}</textarea></div>`;}

let pendingNavigation = null;
function navigate(next, notify = true){
  if(!['dashboard','roster','homepage'].includes(next)) { showToast('This preview includes Dashboard, Roster, and Homepage.'); return; }
  if(next === screen) return;
  if(homepageUnsaved){ pendingNavigation = () => navigate(next,notify); document.getElementById('discard-dialog').showModal(); return; }
  screen = next; group = next==='roster'?'Competition':next==='homepage'?'Website':null;
  document.getElementById('nav-dialog').close(); renderNavigation(); renderPage(); window.scrollTo(0,0);
  if(notify && parent!==window) parent.postMessage({type:'onzio-preview-screen',screen},'*');
}
function showToast(message){const node=document.getElementById('toast');node.innerHTML=`${icon('CircleCheck')}<span>${esc(message)}</span>`;node.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{node.hidden=true;},4200);}

function handleClick(e){
  const button=e.target.closest('button'); if(!button) return;
  if(button.dataset.group){group=group===button.dataset.group?null:button.dataset.group;renderNavigation();const owner=button.closest('#mobile-sidebar')?'mobile-sidebar':'desktop-sidebar';document.querySelector(`#${owner} [data-group="${group || button.dataset.group}"]`)?.focus();return;}
  if(button.dataset.route){const label=button.dataset.route;if(available[label])navigate(available[label]);else showToast(`${label} is outside this three-screen preview.`);return;}
  if(button.dataset.go){navigate(button.dataset.go);return;}
  if(button.dataset.player){openPlayer(Number(button.dataset.player));return;}
  const action=button.dataset.action;
  if(action==='menu')document.getElementById('nav-dialog').showModal();
  if(action==='close-nav')document.getElementById('nav-dialog').close();
  if(action==='add-player')openPlayer(null);
  if(action==='close-editor')closeEditor();
  if(action==='save-player')savePlayer();
  if(action==='edit-homepage')openHomepage();
  if(action==='save-homepage')saveHomepage(true);
  if(action==='save-homepage-inline')saveHomepage(false);
  if(action==='view-site'){navigate('homepage');showToast('Here’s a sample of the club website.');}
  if(action==='sample-event')showToast('Sample match: October 17, 3:00 PM, City Park.');
  if(action==='keep-editing'){pendingNavigation=null;document.getElementById('discard-dialog').close();}
  if(action==='discard'){
    document.getElementById('discard-dialog').close();
    dirty=false;homepageUnsaved=false;homepageDraft={...homepage};
    if(pendingNavigation){const pending=pendingNavigation;pendingNavigation=null;pending();}else{document.getElementById('edit-dialog').close();renderPage();}
  }
}
function handleInput(e){
  if(e.target.id==='player-search'){
    const q=e.target.value.trim().toLowerCase();const filtered=players.filter(p=>[p.name,p.number,p.position].some(s=>s.toLowerCase().includes(q)));
    document.getElementById('player-list').innerHTML=playerRows(filtered);document.getElementById('player-count').textContent=`${filtered.length} ${filtered.length===1?'player':'players'}`;return;
  }
  if(e.target.closest('#edit-dialog'))dirty=true;
  if(e.target.name==='homepage-title'||e.target.name==='homepage-description'){
    homepageDraft[e.target.name==='homepage-title'?'title':'description']=e.target.value;
    homepageUnsaved=homepageDraft.title!==homepage.title||homepageDraft.description!==homepage.description;
    const title=document.getElementById('canvas-title'), description=document.getElementById('canvas-description');
    if(title)title.textContent=homepageDraft.title;if(description)description.textContent=homepageDraft.description;
    document.querySelector('[data-action="save-homepage-inline"]')?.toggleAttribute('disabled',!homepageUnsaved);
    if(document.getElementById('inline-feedback'))document.getElementById('inline-feedback').textContent='';
    document.querySelectorAll('[id$="title-error"]').forEach(n=>n.hidden=true);
  }
}
function dialogMarkup(title, description, fields, action, saveLabel){return `<div class="dialog-layout"><div class="dialog-head"><div><h2 id="edit-title">${title}</h2><p>${description}</p></div><button class="icon-button" data-action="close-editor" aria-label="Close editor">${icon('X')}</button></div><div class="dialog-scroll">${fields}</div><div class="dialog-foot"><button class="button" data-action="${action}">${saveLabel}</button><p>Design preview · Changes stay in this session</p></div></div>`;}
function openPlayer(id){
  editing=id;dirty=false;const p=players.find(p=>p.id===id)||{name:'',number:'',position:'Midfielder'};
  const fields=`<div class="field"><label for="player-name">Player name</label><input id="player-name" value="${esc(p.name)}" autocomplete="off" placeholder="Full name"><p class="field-error" id="player-name-error" role="alert" hidden>Add the player’s name.</p></div><div class="field"><label for="player-position">Position</label><select id="player-position">${['Goalkeeper','Defender','Midfielder','Forward'].map(x=>`<option ${x===p.position?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="player-number">Shirt number</label><input id="player-number" inputmode="numeric" value="${esc(p.number)}" maxlength="2" placeholder="For example, 8"><small>Use a number from 1 to 99.</small><p class="field-error" id="player-number-error" role="alert" hidden>Use a whole number from 1 to 99.</p></div><p class="muted" style="font-size:12px;line-height:1.7">These details help supporters get to know your team.</p>`;
  const dialog=document.getElementById('edit-dialog');dialog.innerHTML=dialogMarkup(id?'Edit player':'Add a player','Player details for your club roster.',fields,'save-player',id?'Save changes':'Add player');dialog.showModal();
}
function closeEditor(){if(dirty || homepageUnsaved){pendingNavigation=null;document.getElementById('discard-dialog').showModal();}else document.getElementById('edit-dialog').close();}
function savePlayer(){
  const name=document.getElementById('player-name').value.trim();const number=document.getElementById('player-number').value.trim();const position=document.getElementById('player-position').value;
  document.getElementById('player-name-error').hidden=!!name;document.getElementById('player-number-error').hidden=/^[1-9][0-9]?$/.test(number);
  if(!name){document.getElementById('player-name').focus();return;}
  if(!/^[1-9][0-9]?$/.test(number)){document.getElementById('player-number').focus();return;}
  const isNew=editing===null;const initials=name.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  if(isNew)players.push({id:Date.now(),name,number,position,initials,color:'#e8edf3'});else Object.assign(players.find(p=>p.id===editing),{name,number,position,initials});
  dirty=false;savedCount++;document.getElementById('edit-dialog').close();renderPage();showToast(isNew?'Player added to this preview.':'Player changes saved in this preview.');
}
function openHomepage(){dirty=false;editing='homepage';const dialog=document.getElementById('edit-dialog');dialog.innerHTML=dialogMarkup('Homepage text','Help supporters get to know your club.',homepageFields('dialog'),'save-homepage','Save changes');dialog.showModal();}
function saveHomepage(modal){
  if(!homepageDraft.title.trim()){document.getElementById(`${modal?'dialog':'inline'}-title-error`).hidden=false;document.getElementById(`${modal?'dialog':'inline'}-title`).focus();return;}
  homepage={...homepageDraft};dirty=false;homepageUnsaved=false;savedCount++;
  if(modal)document.getElementById('edit-dialog').close();renderPage();
  if(!modal)document.getElementById('inline-feedback').textContent='Changes saved in this preview.';
  showToast('Homepage text saved in this preview.');
}
</script>
</body>
</html>
