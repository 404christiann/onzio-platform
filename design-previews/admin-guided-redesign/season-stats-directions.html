<script>
'use strict';
const params=new URLSearchParams(location.search), embedded=params.has('embedded'), direction=params.get('direction')||'a';
document.documentElement.dataset.theme=params.get('theme')||'light';
const optionInfo={
 a:{name:'Player workspace',short:'One player. Everything in one place.',description:'Select a player, then edit clearly grouped totals. On a phone, the player opens as a full page with Save always within reach.'},
 b:{name:'Guided update',short:'A few fields at a time.',description:'Move through playing time, attacking, defending and discipline. A review step shows the player’s totals before saving the team’s changes.'},
 c:{name:'Team worksheet',short:'The same stats, across the team.',description:'Update one category for everyone. Desktop shows a short worksheet; phone shows one named stat at a time with comfortable controls.'}
};
function escapeHTML(value){return String(value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
if(!embedded){
 document.body.innerHTML='<main><div class="chooser"><div class="chooser-top"><div><h1>A better way to update season stats.</h1><p>Three directions for everyday club staff. Try entering a number, selecting a goalkeeper, and saving your changes.</p></div><div class="demo-label">Interactive concepts · sample data</div></div><div class="choices" aria-label="Choose a design direction">'+Object.entries(optionInfo).map(function(entry){const key=entry[0],v=entry[1];return '<button class="choice" data-direction="'+key+'" aria-pressed="'+(key==='a')+'"><span class="choice-letter">'+key.toUpperCase()+'</span><span><strong>'+v.name+'</strong><small>'+v.short+'</small>'+(key==='a'?'<span class="recommendation">Recommended for your staff</span>':'')+'</span></button>'}).join('')+'</div><div class="preview-tools"><p id="direction-description">'+optionInfo.a.description+'</p><div class="display-tools"><div class="segment" aria-label="Preview size"><button data-view="desktop" aria-pressed="true">Desktop</button><button data-view="phone" aria-pressed="false">Phone</button><button data-view="both" aria-pressed="false">Both</button></div><label class="sr-only" for="appearance">Appearance</label><select class="select" id="appearance"><option value="light">Light</option><option value="dark">Dark</option></select></div></div></div><div class="frames" id="frames"></div><p class="chooser-footer">All three retain every outfield and goalkeeper stat. Demo edits stay in this preview; the portal is unchanged.</p></main>';
 let active='a',view='desktop',theme='light';
 function renderFrames(){
  document.querySelector('#frames').className='frames'+(view==='both'?' both':'');
  const screens=view==='both'?['desktop','phone']:[view];
  document.querySelector('#frames').innerHTML=screens.map(function(screen){return '<section class="frame-unit '+screen+'-unit"><div class="frame-caption"><span>'+optionInfo[active].name+' · '+(screen==='phone'?'Phone, 390px':'Desktop')+'</span><span>Live prototype</span></div><div class="frame-wrap"><iframe title="'+optionInfo[active].name+' — '+screen+' prototype" src="'+location.pathname+'?embedded=1&amp;direction='+active+'&amp;theme='+theme+'"></iframe></div></section>'}).join('');

 function cMarkup(){let cat=categories.find(c=>c.key===category),visible=relevantPlayers();if(!cat.fields.includes(metric))metric=cat.fields[0];return '<div class="worksheet-tools"><div class="category-tabs" aria-label="Stat categories">'+categories.map(c=>'<button data-category="'+c.key+'" aria-pressed="'+(category===c.key)+'">'+c.name+'</button>').join('')+'</div><label class="sr-only" for="player-search">Find a player</label><input class="search" id="player-search" type="search" placeholder="Find a player" value="'+escapeHTML(query)+'"><label class="metric-mobile" for="metric">Stat to update<select class="select" id="metric">'+categories.map(c=>'<optgroup label="'+c.name+'">'+c.fields.map(k=>'<option value="'+c.key+':'+k+'" '+(category===c.key&&metric===k?'selected':'')+'>'+labels[k]+'</option>').join('')+'</optgroup>').join('')+'</select></label></div><section class="worksheet surface" aria-label="Team stat worksheet"><div class="worksheet-heading"><div><h2>'+cat.name+'</h2><p>'+(mobileMatcher.matches?labels[metric]+' · ': '')+visible.length+' player'+(visible.length===1?'':'s')+(category==='keeper'?' · Goalkeepers':['attack','defend'].includes(category)?' · Outfield':'')+'</p></div><span class="worksheet-tip">Tab to move between fields</span></div>'+(visible.length?'<div class="table-clip desktop-only"><table class="stats-table"><thead><tr><th scope="col">Player</th>'+cat.fields.map(k=>'<th scope="col">'+labels[k]+'</th>').join('')+'</tr></thead><tbody>'+visible.map(p=>'<tr><th scope="row" style="background:transparent;font-weight:400"><span class="table-player">'+person(p)+'</span></th>'+cat.fields.map(k=>'<td>'+inputControl(p,k,'-desktop')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><div class="metric-list mobile-only">'+visible.map(p=>'<div class="metric-row"><div class="table-player">'+person(p)+'</div>'+inputControl(p,metric,'-phone')+'</div>').join('')+'</div>':'<p class="worksheet-empty">No matching players.</p>')+'</section>'}
 function render(){
  document.body.innerHTML='<div class="app"><header class="appbar"><div class="club"><span class="club-mark" aria-hidden="true">FC</span> Meadow FC <span class="crumb">/ Competition / Season Stats</span></div><span class="account" aria-label="Club administrator">JD</span></header><main class="page"><div class="page-head"><div><h1>Season Stats</h1><p>'+(direction==='a'?'Every player. A clearer picture.':direction==='b'?'Update your team, one step at a time.':'Less scrolling. Faster team updates.')+'</p></div><label class="season-control" for="season">'+(season==='2026'?'Active season':'Season')+'<select id="season" class="select"><option value="2026" '+(season==='2026'?'selected':'')+'>2026</option><option value="2025" '+(season==='2025'?'selected':'')+'>2025</option></select></label></div><div class="context"><span class="desktop-only"><strong>Public roster totals.</strong> Entered here, separately from Match Stats.</span><span class="mobile-only">Manual totals · Separate from Match Stats</span><span class="pill">Manual totals</span></div><div id="editor">'+(direction==='a'?aMarkup():direction==='b'?bMarkup():cMarkup())+'</div></main><footer class="savebar"><div class="save-copy" id="save-copy"></div><div class="save-buttons"><button class="link-button" data-action="review-changes">Review</button><button class="primary" data-action="save" disabled>Save changes</button></div></footer><span class="sr-only" id="announce" role="status" aria-live="polite"></span></div><dialog id="review-dialog" aria-labelledby="dialog-title"></dialog>';

 function updateFeedback(){
