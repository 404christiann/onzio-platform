name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      # Pull requests scan only their own commits; pushes to main and manual runs scan the full history.
      # Reviewed false positives are listed by fingerprint in .gitleaksignore.
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        run: gitleaks git --redact --no-banner --exit-code 1 --log-opts="origin/${{ github.base_ref }}..HEAD" .

      - name: Scan full history
        if: github.event_name != 'pull_request'
        run: gitleaks git --redact --no-banner --exit-code 1 .
