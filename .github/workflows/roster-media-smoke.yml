name: Public site media smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 15 * * *"

permissions:
  contents: read

jobs:
  verify-site-media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_MEDIA_BASE_URL: https://onzio-platform.vercel.app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify desktop and mobile site media
        run: npx playwright test --config=playwright.site-media.config.ts
