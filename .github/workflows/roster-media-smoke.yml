name: Public roster media smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 15 * * *"

permissions:
  contents: read

jobs:
  verify-roster-media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ROSTER_MEDIA_BASE_URL: https://www.rosecityfutbolclub.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify desktop and mobile roster media
        run: npm run test:browser:roster
