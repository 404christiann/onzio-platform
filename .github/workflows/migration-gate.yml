name: Production migration gate

# CLAUDE.md's mandatory gate: each migration file in the branch must already be applied to production, and a merged
# migration is never edited. Strictly read-only: `supabase link` and `supabase migration list` only. Never add
# `db push`, `migration repair` or any other write here.
#
# Runs on every pull request so it can be a required check; a pull request that changes no migration passes after
# the diff. One that adds a migration needs the repository secrets SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and
# SUPABASE_PROJECT_REF (the production ref is kept out of this public repo) and fails without them. Fork pull
# requests cannot read secrets, so the job is skipped for them.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations-applied:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # A manual run checks the whole branch against production.
      - name: Find migration changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # -z: NUL-separated and never quoted, so a non-ASCII file name is read as itself.
          git diff --no-renames --name-status -z "$BASE_SHA" HEAD -- supabase/migrations > "$RUNNER_TEMP/changes.txt"
          status=0
          node scripts/check-migrations-applied.mjs --changes < "$RUNNER_TEMP/changes.txt" > "$RUNNER_TEMP/changes.out" || status=$?
          cat "$RUNNER_TEMP/changes.out"
          [ "$status" -eq 0 ] || exit "$status"
          grep '^changed=' "$RUNNER_TEMP/changes.out" >> "$GITHUB_OUTPUT"

      - name: Require production secrets
        if: steps.changes.outputs.changed == 'true'
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          [ -n "$SUPABASE_PROJECT_REF" ] || missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error title=Migration gate cannot check production::Missing repository secrets:$missing"
            exit 1
          fi

      # 2.122.0 is the CLI the gate has been run with by hand.
      - name: Set up Supabase CLI
        if: steps.changes.outputs.changed == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Link the production project (read-only)
        if: steps.changes.outputs.changed == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --agent no < /dev/null

      - name: Compare branch migrations with production
        if: steps.changes.outputs.changed == 'true'
        run: |
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" --agent no --output-format json > "$RUNNER_TEMP/migrations.json"
          node scripts/check-migrations-applied.mjs < "$RUNNER_TEMP/migrations.json"
