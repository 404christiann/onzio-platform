name: Production migration gate

# CLAUDE.md's mandatory gate, run on every pull request that changes a migration: each migration file in the branch
# must already be applied to production. Strictly read-only: `supabase link` and `supabase migration list` only.
# Never add `db push`, `migration repair` or any other write here.
#
# Needs the repository secrets SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_REF (the production
# ref is kept out of this public repo). Fork pull requests and runs without those secrets skip instead of failing.

on:
  pull_request:
    paths:
      - supabase/migrations/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations-applied:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Check for production secrets
        id: secrets
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Migration gate skipped::SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD or SUPABASE_PROJECT_REF is not set."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@v7

      - name: Use Node.js 22
        if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 2.122.0 is the CLI the gate has been run with by hand.
      - name: Set up Supabase CLI
        if: steps.secrets.outputs.present == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Link the production project (read-only)
        if: steps.secrets.outputs.present == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --agent no < /dev/null

      - name: Compare branch migrations with production
        if: steps.secrets.outputs.present == 'true'
        run: |
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" --agent no --output-format json > "$RUNNER_TEMP/migrations.json"
          node scripts/check-migrations-applied.mjs < "$RUNNER_TEMP/migrations.json"
